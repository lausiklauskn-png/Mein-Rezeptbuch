<!doctype html>
<html lang="de" data-ausgabe="muttis">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e0d8f6">
<meta name="description" content="Muttis Rezeptbuch: Rezepte sammeln, kochen, planen. Läuft im Gerät, ohne Konto.">
<meta name="robots" content="noindex">
<title>Muttis Rezeptbuch</title>
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-book-192.png?v=1">
<link rel="manifest" href="./muttis.webmanifest">

<script type="module" src="./app.mjs?v=0.14.6"></script>
</head>
<body>
<div class="app" id="app">
  <header class="kopf" id="kopf"></header>
  <main id="main"><p class="laden">Rezeptbuch wird geöffnet …</p></main>
</div>
<aside class="fl r" id="leiste" aria-label="Bereiche"></aside>
<div id="kochort"></div>
<div id="fensterort"></div>
<input type="file" id="datei-sicherung" accept=".json,application/json" hidden>
<input type="file" id="datei-bild" accept="image/*" hidden>
<input type="file" id="datei-scan" accept="image/*,application/pdf,.pdf" multiple hidden>
<input type="file" id="datei-kamera" accept="image/*" capture="environment" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:20px">Für Muttis Rezeptbuch bitte JavaScript einschalten.</p></noscript>
